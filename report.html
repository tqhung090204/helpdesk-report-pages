<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HKT Solutions - Báo cáo Helpdesk hôm nay</title>

    <!-- Font Google Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
      :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --bg-body: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --star-active: #f59e0b;
        --shadow-sm:
          0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
        --shadow-md:
          0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background-color: var(--bg-body);
        color: var(--text-main);
        min-height: 100vh;
        padding: 32px 16px;
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
      }

      /* Header Section */
      .dashboard-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 28px;
        background: var(--card-bg);
        padding: 20px 24px;
        border-radius: 16px;
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-sm);
      }

      .header-title h1 {
        font-size: 20px;
        font-weight: 700;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .header-title h1 i {
        color: var(--primary);
      }

      .header-title .sub {
        color: var(--text-muted);
        font-size: 13px;
        margin-top: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .btn-refresh {
        background: #eff6ff;
        color: var(--primary);
        border: 1px solid #bfdbfe;
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s ease;
      }

      .btn-refresh:hover {
        background: #dbeafe;
        transform: translateY(-1px);
      }

      .btn-refresh i.spin {
        animation: spin 0.8s linear infinite;
      }

      /* KPI Grid */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 28px;
      }

      .stat-card {
        background: var(--card-bg);
        border-radius: 16px;
        padding: 20px;
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        gap: 16px;
        transition: all 0.2s ease;
      }

      .stat-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }

      .stat-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
      }

      .stat-icon.blue {
        background: #eff6ff;
        color: #2563eb;
      }
      .stat-icon.green {
        background: #f0fdf4;
        color: #16a34a;
      }
      .stat-icon.amber {
        background: #fffbeb;
        color: #d97706;
      }
      .stat-icon.purple {
        background: #faf5ff;
        color: #9333ea;
      }

      .stat-info .num {
        font-size: 26px;
        font-weight: 700;
        color: var(--text-main);
        line-height: 1.2;
      }

      .stat-info .label {
        color: var(--text-muted);
        font-size: 13px;
        font-weight: 500;
        margin-top: 2px;
      }

      /* Table Container */
      .table-card {
        background: var(--card-bg);
        border-radius: 16px;
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }

      .table-header {
        padding: 18px 24px;
        border-bottom: 1px solid var(--border-color);
        font-size: 15px;
        font-weight: 600;
        color: var(--text-main);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      /* Filter bar */
      .filter-bar {
        display: flex;
        align-items: flex-end;
        flex-wrap: wrap;
        gap: 14px;
        padding: 16px 24px;
        border-bottom: 1px solid var(--border-color);
        background: #fafbfc;
      }
      .filter-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .filter-field label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .filter-field input,
      .filter-field select {
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
        font-family: inherit;
        color: var(--text-main);
        background: #fff;
      }
      .btn-filter,
      .btn-filter-clear {
        border: none;
        border-radius: 8px;
        padding: 9px 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn-filter {
        background: var(--primary);
        color: #fff;
      }
      .btn-filter:hover {
        background: var(--primary-hover);
      }
      .btn-filter-clear {
        background: #f1f5f9;
        color: var(--text-muted);
      }
      .btn-filter-clear:hover {
        background: #e2e8f0;
      }

      /* Quick range buttons */
      .quick-range {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 14px 24px 0;
      }
      .btn-quick {
        border: 1px solid var(--border-color);
        background: #fff;
        color: var(--text-muted);
        border-radius: 20px;
        padding: 6px 14px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .btn-quick:hover {
        border-color: var(--primary);
        color: var(--primary);
      }
      .btn-quick.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }

      @media (max-width: 640px) {
        .quick-range {
          padding: 12px 16px 0;
        }
      }

      @media (max-width: 640px) {
        .filter-bar {
          padding: 14px 16px;
        }
        .filter-field {
          flex: 1 1 45%;
        }
      }

      .table-wrapper {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      th {
        background: #f8fafc;
        color: #475569;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border-color);
        white-space: nowrap;
      }

      td {
        padding: 14px 20px;
        font-size: 13.5px;
        color: var(--text-main);
        border-bottom: 1px solid var(--border-color);
        vertical-align: middle;
      }

      tbody tr {
        transition: background 0.15s ease;
      }

      tbody tr:hover {
        background: #f8fafc;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      .ticket-id {
        font-weight: 600;
        color: var(--primary);
      }

      .company-name {
        font-weight: 500;
      }

      .request-text {
        color: #334155;
        max-width: 260px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Status Badges */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }

      .badge-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }

      .b-open {
        background: #fffbeb;
        color: #b45309;
      }
      .b-open .badge-dot {
        background: #f59e0b;
      }

      .b-progress {
        background: #eff6ff;
        color: #1d4ed8;
      }
      .b-progress .badge-dot {
        background: #3b82f6;
      }

      .b-close {
        background: #f0fdf4;
        color: #15803d;
      }
      .b-close .badge-dot {
        background: #22c55e;
      }

      .b-cancel {
        background: #f1f5f9;
        color: #64748b;
      }
      .b-cancel .badge-dot {
        background: #94a3b8;
      }

      /* Star Rating Cell */
      .rating-stars {
        display: flex;
        align-items: center;
        gap: 3px;
        color: var(--star-active);
        font-size: 13px;
      }

      .rating-none {
        color: #94a3b8;
        font-size: 12px;
        font-style: italic;
      }

      /* Skeleton Loading State */
      .skeleton {
        background: linear-gradient(
          90deg,
          #f1f5f9 25%,
          #e2e8f0 50%,
          #f1f5f9 75%
        );
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
        border-radius: 6px;
        height: 16px;
      }

      @keyframes loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 640px) {
        body {
          padding: 16px 10px;
        }
        .dashboard-header {
          padding: 16px;
        }
        .table-header {
          padding: 14px 16px;
        }
        td,
        th {
          padding: 10px 14px;
        }
      }

      /* Expand/Collapse row */
      .chevron-cell {
        width: 36px;
        text-align: center;
        cursor: pointer;
        color: #94a3b8;
      }
      tr.row-main {
        cursor: pointer;
      }
      tr.row-main:hover .chevron-cell i {
        color: var(--primary);
      }
      .chevron-cell i {
        transition: transform 0.2s ease;
        display: inline-block;
      }
      tr.row-main.expanded .chevron-cell i {
        transform: rotate(180deg);
        color: var(--primary);
      }

      .detail-row td {
        background: #f8fafc;
        padding: 0;
        border-bottom: 1px solid var(--border-color);
      }
      .detail-row.hidden {
        display: none;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 18px 28px;
        padding: 18px 24px;
      }

      .detail-field .dl {
        font-size: 11px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 4px;
      }
      .detail-field .dv {
        font-size: 13.5px;
        color: var(--text-main);
        font-weight: 600;
      }
      .detail-field .dv.link {
        color: var(--primary);
      }
      .detail-field .dv.sla {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #dc2626;
        font-weight: 600;
      }
      .detail-field .dv.muted {
        color: var(--text-muted);
        font-weight: 400;
      }

      @media (max-width: 900px) {
        .detail-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      /* ====== RESPONSIVE: chuyển bảng thành dạng thẻ xếp dọc, không cuộn ngang ====== */
      @media (max-width: 860px) {
        .table-wrapper {
          overflow-x: visible;
        }

        table,
        thead,
        tbody {
          display: block;
          width: 100%;
        }
        thead {
          display: none;
        } /* ẩn header cột, thay bằng nhãn từng dòng */

        tbody tr.row-main {
          display: block;
          position: relative;
          border: 1px solid var(--border-color);
          border-radius: 12px;
          margin: 12px;
          padding: 14px 44px 14px 14px;
          background: var(--card-bg);
        }
        tbody tr.row-main:hover {
          background: var(--card-bg);
        }

        tbody tr.row-main td {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          gap: 12px;
          padding: 6px 0;
          border-bottom: none;
          white-space: normal;
        }

        tbody tr.row-main td::before {
          content: attr(data-label);
          flex: 0 0 auto;
          font-size: 11px;
          font-weight: 600;
          color: var(--text-muted);
          text-transform: uppercase;
          letter-spacing: 0.04em;
          padding-top: 2px;
        }

        tbody tr.row-main td.chevron-cell::before {
          content: none;
        }

        .chevron-cell {
          position: absolute;
          top: 14px;
          right: 14px;
          width: auto;
          display: block !important;
        }

        .request-text {
          max-width: 65%;
          white-space: normal;
          text-align: right;
        }

        .detail-row {
          margin: 0 12px 12px;
        }
        .detail-row td {
          padding: 0;
        }
        .detail-grid {
          grid-template-columns: 1fr;
          padding: 14px;
          gap: 14px;
        }
        .detail-field .dv {
          text-align: left;
        }
      }

      .header-logo {
        height: 28px; /* Chiều cao khớp với chữ */
        width: auto; /* Tự điều chỉnh chiều rộng theo tỉ lệ */
        object-fit: contain;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- Header -->
      <div class="dashboard-header">
        <div class="header-title">
          <h1>
            <img src="./assets/hkt.jpg" alt="Logo" class="header-logo" />
            Báo cáo Helpdesk Hôm nay
          </h1>
          <div class="sub">
            <i class="fa-regular fa-clock"></i>
            <span id="today-label">Đang tải thời gian...</span>
          </div>
        </div>
        <button class="btn-refresh" onclick="refreshData()">
          <i class="fa-solid fa-rotate-right" id="refresh-icon"></i> Làm mới dữ
          liệu
        </button>
      </div>

      <!-- KPI Grid -->
      <div class="grid" id="stats">
        <div class="stat-card">
          <div class="stat-icon blue"><i class="fa-solid fa-ticket"></i></div>
          <div class="stat-info">
            <div class="num">-</div>
            <div class="label">Tổng công việc</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">
            <i class="fa-solid fa-circle-check"></i>
          </div>
          <div class="stat-info">
            <div class="num">-</div>
            <div class="label">Đã hoàn tất</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon amber">
            <i class="fa-solid fa-hourglass-half"></i>
          </div>
          <div class="stat-info">
            <div class="num">-</div>
            <div class="label">Chờ xác nhận</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon purple">
            <i class="fa-solid fa-folder-open"></i>
          </div>
          <div class="stat-info">
            <div class="num">-</div>
            <div class="label">Chưa hoàn tất</div>
          </div>
        </div>
      </div>

      <!-- Table Card -->
      <div class="table-card">
        <div class="table-header">
          <span>Danh sách sự vụ</span>
          <span
            id="record-count"
            style="font-size: 12px; font-weight: 500; color: var(--text-muted)"
            >Đang tải...</span
          >
        </div>

        <div class="quick-range" id="quick-range">
          <button
            class="btn-quick"
            data-range="today"
            onclick="setQuickRange('today')"
          >
            Hôm nay
          </button>
          <button
            class="btn-quick"
            data-range="yesterday"
            onclick="setQuickRange('yesterday')"
          >
            Hôm qua
          </button>
          <button
            class="btn-quick"
            data-range="thisweek"
            onclick="setQuickRange('thisweek')"
          >
            Tuần này
          </button>
          <button
            class="btn-quick"
            data-range="thismonth"
            onclick="setQuickRange('thismonth')"
          >
            Tháng này
          </button>
          <button
            class="btn-quick"
            data-range="lastmonth"
            onclick="setQuickRange('lastmonth')"
          >
            Tháng trước
          </button>
          <button
            class="btn-quick"
            data-range="all"
            onclick="setQuickRange('all')"
          >
            Toàn bộ
          </button>
        </div>

        <div class="filter-bar">
          <div class="filter-field">
            <label>Từ ngày</label>
            <input type="date" id="f-from" />
          </div>
          <div class="filter-field">
            <label>Đến ngày</label>
            <input type="date" id="f-to" />
          </div>
          <div class="filter-field">
            <label>Trạng thái</label>
            <select id="f-status">
              <option value="">Tất cả</option>
              <option value="Open">Mở sự vụ</option>
              <option value="In_progress">Đang xử lý</option>
              <option value="Wait_Confirm">Chờ xác nhận</option>
              <option value="Pending">Tạm hoãn</option>
              <option value="Close">Đã đóng</option>
              <option value="Cancel">Đã hủy</option>
            </select>
          </div>
          <button class="btn-filter" onclick="applyFilter()">
            <i class="fa-solid fa-filter"></i> Lọc
          </button>
          <button class="btn-filter-clear" onclick="clearFilter()">
            <i class="fa-solid fa-xmark"></i> Xóa lọc
          </button>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th></th>
                <th>Mã Ticket</th>
                <th>Công ty / Khách sạn</th>
                <th>Người yêu cầu</th>
                <th>Nội dung yêu cầu</th>
                <th>Thời gian tạo</th>
                <th>CS Phản hồi</th>
                <th>KT Hoàn tất</th>
                <th>Trạng thái</th>
              </tr>
            </thead>
            <tbody id="rows">
              <!-- Skeleton Loading Rows -->
              <tr>
                <td><div class="skeleton" style="width: 16px"></div></td>
                <td><div class="skeleton" style="width: 60px"></div></td>
                <td><div class="skeleton" style="width: 100px"></div></td>
                <td><div class="skeleton" style="width: 90px"></div></td>
                <td><div class="skeleton" style="width: 180px"></div></td>
                <td><div class="skeleton" style="width: 90px"></div></td>
                <td><div class="skeleton" style="width: 90px"></div></td>
                <td><div class="skeleton" style="width: 90px"></div></td>
                <td><div class="skeleton" style="width: 70px"></div></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      // ====== CẤU HÌNH SUPABASE ======
      const SUPABASE_URL = "https://hhmuiarznaawrlpobliu.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhobXVpYXJ6bmFhd3JscG9ibGl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNTMwMjcsImV4cCI6MjEwNTYyOTAyN30.EL8C-bpNfE9K4IYiAWCFGzgJuR_DQQIu8HURg9EEs34";

      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
      );

      function statusBadge(status) {
        const map = {
          Open: ["b-open", "Mở sự vụ"],
          In_progress: ["b-progress", "Đang xử lý"],
          Wait_Confirm: ["b-progress", "Chờ xác nhận"],
          Pending: ["b-open", "Tạm hoãn"],
          Fix: ["b-progress", "Chỉnh sửa"],
          Close: ["b-close", "Đã đóng"],
          Cancel: ["b-cancel", "Đã hủy"],
        };
        const [cls, label] = map[status] || ["b-open", status];
        return `<span class="badge ${cls}"><span class="badge-dot"></span>${label}</span>`;
      }

      function ratingBlock(t) {
        if (t.Rating_Stars) {
          let starsHtml = "";
          for (let i = 1; i <= 5; i++) {
            starsHtml +=
              i <= t.Rating_Stars
                ? `<i class="fa-solid fa-star"></i>`
                : `<i class="fa-regular fa-star" style="color:#cbd5e1;"></i>`;
          }
          return `<div class="rating-stars">${starsHtml} <span style="margin-left:4px;font-weight:600;color:#334155;">(${t.Rating_Stars})</span></div>
            ${t.Rating_Comment ? `<div style="margin-top:4px;font-style:italic;color:#475569;">"${t.Rating_Comment}"</div>` : ""}`;
        }
        return `<span class="rating-none">Khách hàng chưa đánh giá</span>`;
      }

      function formatDateTime(value) {
        if (!value) return "-";
        const d = new Date(value);
        if (isNaN(d.getTime())) return "-";
        return d.toLocaleString("vi-VN", {
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function toggleRow(idx) {
        const row = document.getElementById("detail-" + idx);
        const mainRow = document.getElementById("main-" + idx);
        row.classList.toggle("hidden");
        mainRow.classList.toggle("expanded");
      }

      function renderStats(list) {
        const statEls = document.querySelectorAll(".stat-card .num");
        const total = list.length;
        const completed = list.filter((t) => t.Status === "Close").length;
        const awaitingConfirm = list.filter(
          (t) => t.Status === "Wait_Confirm",
        ).length;
        const notCompleted = list.filter(
          (t) => t.Status !== "Close" && t.Status !== "Cancel",
        ).length;

        statEls[0].textContent = total;
        statEls[1].textContent = completed;
        statEls[2].textContent = awaitingConfirm;
        statEls[3].textContent = notCompleted;
      }

      async function loadTable() {
        const rowsEl = document.getElementById("rows");
        const countEl = document.getElementById("record-count");
        countEl.textContent = "Đang tải...";

        const fromDate = document.getElementById("f-from").value; // yyyy-mm-dd
        const toDate = document.getElementById("f-to").value;
        const status = document.getElementById("f-status").value;

        // Lấy theo đúng khoảng NGÀY đang chọn (chưa lọc trạng thái) để 4 ô KPI luôn khớp đúng khoảng ngày này
        let query = supabaseClient
          .from("v_ticket_public")
          .select("*")
          .order("Ticket_ID", { ascending: false })
          .limit(1000); // đủ lớn cho quy mô helpdesk vừa/nhỏ

        if (fromDate) query = query.gte("Created_time", fromDate + "T00:00:00");
        if (toDate) query = query.lte("Created_time", toDate + "T23:59:59");

        const { data: ticketsInRange, error } = await query;

        if (error) {
          countEl.textContent = "Lỗi tải dữ liệu";
          rowsEl.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:32px;color:#c62828;">Có lỗi khi tải dữ liệu: ${error.message}</td></tr>`;
          return;
        }

        renderStats(ticketsInRange || []);

        // Bảng danh sách: lọc thêm theo trạng thái (nếu có chọn), trên cùng tập dữ liệu vừa lấy
        const tickets = status
          ? (ticketsInRange || []).filter((t) => t.Status === status)
          : ticketsInRange || [];

        if (tickets.length === 0) {
          countEl.textContent = "0 bản ghi";
          rowsEl.innerHTML = `
      <tr>
        <td colspan="9" style="text-align: center; padding: 32px; color: var(--text-muted);">
          <i class="fa-solid fa-inbox" style="font-size: 32px; margin-bottom: 8px; color: #cbd5e1;"></i>
          <div>Không có ticket nào khớp bộ lọc.</div>
        </td>
      </tr>`;
          return;
        }

        countEl.textContent = tickets.length + " bản ghi";

        rowsEl.innerHTML = tickets
          .map(
            (t, idx) => `
    <tr class="row-main" id="main-${idx}" onclick="toggleRow(${idx})">
      <td class="chevron-cell"><i class="fa-solid fa-chevron-down"></i></td>
      <td data-label="Mã Ticket"><span class="ticket-id">#${t.Ticket_ID}</span></td>
      <td data-label="Công ty"><span class="company-name">${t.Company || "-"}</span></td>
      <td data-label="Người yêu cầu">${t.Customer || "-"}</td>
      <td data-label="Nội dung"><div class="request-text" title="${t.Request || ""}">${t.Request || "-"}</div></td>
      <td data-label="Tạo lúc">${formatDateTime(t.Created_time)}</td>
      <td data-label="CS Phản hồi">${formatDateTime(t.Reception_time)}</td>
      <td data-label="KT Hoàn tất">${formatDateTime(t.Resolve_time)}</td>
      <td data-label="Trạng thái">${statusBadge(t.Status)}</td>
    </tr>
    <tr class="detail-row hidden" id="detail-${idx}">
      <td colspan="9">
        <div class="detail-grid">
          <div class="detail-field">
            <div class="dl">Ticket ID</div>
            <div class="dv link">${t.Ticket_ID}</div>
          </div>
          <div class="detail-field">
            <div class="dl">Hạng mục</div>
            <div class="dv">${t.Layer_detail || "-"}</div>
          </div>
          <div class="detail-field">
            <div class="dl">NV Hỗ trợ</div>
            <div class="dv"><i class="fa-solid fa-user-shield" style="color:var(--primary);margin-right:4px;"></i>${t.Staff || "-"}${t.Staff_Support_Names ? ", " + t.Staff_Support_Names : ""}</div>
          </div>
          <div class="detail-field">
            <div class="dl">Phản hồi của KH</div>
            <div class="dv muted">${ratingBlock(t)}</div>
          </div>

          <div class="detail-field">
            <div class="dl">Mức độ</div>
            <div class="dv">${t.Level_detail || "-"}</div>
          </div>
          <div class="detail-field">
            <div class="dl">Phương thức</div>
            <div class="dv">${t.Method || "-"}</div>
          </div>
          <div class="detail-field">
            <div class="dl">SLA CS</div>
            <div class="dv sla"><i class="fa-solid fa-triangle-exclamation"></i>${formatDateTime(t.SLA_Cs_Deadline)}</div>
          </div>
          <div class="detail-field">
            <div class="dl">SLA Kỹ thuật</div>
            <div class="dv sla"><i class="fa-solid fa-triangle-exclamation"></i>${formatDateTime(t.SLA_It_Deadline)}</div>
          </div>
        </div>
      </td>
    </tr>
  `,
          )
          .join("");
      }

      function applyFilter() {
        setActiveQuickBtn(null); // lọc tay -> bỏ highlight nút nhanh
        loadTable();
      }

      function clearFilter() {
        document.getElementById("f-from").value = "";
        document.getElementById("f-to").value = "";
        document.getElementById("f-status").value = "";
        setActiveQuickBtn("all");
        loadTable();
      }

      function toISODate(d) {
        return d.toISOString().slice(0, 10);
      }

      function setActiveQuickBtn(range) {
        document.querySelectorAll("#quick-range .btn-quick").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.range === range);
        });
      }

      function setQuickRange(range) {
        const today = new Date();
        let from, to;

        switch (range) {
          case "today":
            from = to = new Date(today);
            break;
          case "yesterday":
            from = to = new Date(today);
            from.setDate(from.getDate() - 1);
            to.setDate(to.getDate() - 1);
            break;
          case "thisweek": {
            const day = (today.getDay() + 6) % 7; // Thứ 2 = 0 ... Chủ nhật = 6
            from = new Date(today);
            from.setDate(today.getDate() - day);
            to = new Date(today);
            break;
          }
          case "thismonth":
            from = new Date(today.getFullYear(), today.getMonth(), 1);
            to = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            break;
          case "lastmonth":
            from = new Date(today.getFullYear(), today.getMonth() - 1, 1);
            to = new Date(today.getFullYear(), today.getMonth(), 0);
            break;
          case "all":
          default:
            document.getElementById("f-from").value = "";
            document.getElementById("f-to").value = "";
            setActiveQuickBtn("all");
            loadTable();
            return;
        }

        document.getElementById("f-from").value = toISODate(from);
        document.getElementById("f-to").value = toISODate(to);
        setActiveQuickBtn(range);
        loadTable();
      }

      async function refreshData() {
        const icon = document.getElementById("refresh-icon");
        icon.classList.add("spin");
        await loadTable(); // giữ nguyên bộ lọc đang chọn, tải lại cả KPI lẫn bảng
        setTimeout(() => icon.classList.remove("spin"), 600);
      }

      async function init() {
        const now = new Date();
        document.getElementById("today-label").textContent =
          "Cập nhật lúc " +
          now.toLocaleTimeString("vi-VN") +
          " - " +
          now.toLocaleDateString("vi-VN");

        setQuickRange("today"); // mặc định mở trang là báo cáo Hôm nay, tự gọi loadTable() bên trong
      }

      init();
    </script>
  </body>
</html>
